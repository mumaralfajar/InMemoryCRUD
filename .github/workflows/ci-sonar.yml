name: CI with SonarQube

on:
  push:
    branches:
      - master

jobs:
  build-and-analyze:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install .NET SDK manually
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri https://dot.net/v1/dotnet-install.ps1 -OutFile dotnet-install.ps1
        ./dotnet-install.ps1 -Version 8.0.100 -InstallDir "$env:USERPROFILE\.dotnet"
        echo "$env:USERPROFILE\.dotnet" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Install dotnet-sonarscanner tool
      run: dotnet tool install --global dotnet-sonarscanner

    - name: Restore dependencies
      run: dotnet restore

    - name: Begin SonarQube analysis
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        dotnet sonarscanner begin /k:"InMemoryCRUD" /d:sonar.host.url="http://localhost:9000" /d:sonar.login=$SONAR_TOKEN

    - name: Build
      run: dotnet build --no-restore

    - name: Test
      run: dotnet test --no-build --collect:"XPlat Code Coverage"

    - name: End SonarQube analysis
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: dotnet sonarscanner end /d:sonar.login=$SONAR_TOKEN
