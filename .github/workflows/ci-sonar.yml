name: CI with SonarQube

on:
  push:
    branches:
      - master

jobs:
  build-and-analyze:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0'

    - name: Install dotnet-sonarscanner tool
      run: dotnet tool install --global dotnet-sonarscanner

    - name: Restore dependencies
      run: dotnet restore

    - name: Begin SonarQube analysis
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        dotnet sonarscanner begin \
          /k:"InMemoryCRUD" \
          /d:sonar.host.url="http://localhost:9000" \
          /d:sonar.login=$SONAR_TOKEN \
          /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"

    - name: Build
      run: dotnet build --no-restore

    - name: Test
      run: dotnet test --no-build --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

    - name: Check coverage file
      run: find . -name "coverage.opencover.xml"

    - name: End SonarQube analysis
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: dotnet sonarscanner end /d:sonar.login=$SONAR_TOKEN
